<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動歡迎看板 - 史萊姆手部追蹤</title>
    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: #ffffff;
            color: #111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* 隱藏攝影機影像，我們只需要追蹤數據 */
        .input_video {
            display: none;
        }

        /* 軟糖容器 */
        .slime-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        /* 夢幻史萊姆泡泡樣式 (原本那種感覺) */
        .blob {
            position: absolute;
            top: 0;
            left: 0;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            user-select: none;
            opacity: 0.7;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.5), 0 10px 20px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(3px);
            transition: opacity 0.2s ease-out;
            cursor: pointer;
            pointer-events: auto;
            will-change: transform;
        }

        /* 跟隨手部的「物理核心」感應器 */
        #hand-blob {
            font-size: 120px;
            top: 0;
            left: 0;
            opacity: 0; /* 偵測到手才顯示 */
            z-index: 50;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0) 70%);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.1);
        }

        /* 回首頁按鈕 */
        .back-link {
            position: absolute;
            top: 30px;
            left: 30px;
            font-size: 1rem;
            color: rgba(0, 0, 0, 0.8);
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 20px;
            z-index: 100;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: rgba(0, 0, 0, 0.05);
            color: #000;
            border-color: #000;
            transform: translateX(-5px);
        }

        /* 歡迎內容區塊 */
        .welcome-container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 4rem;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.05);
            transform-style: preserve-3d;
            perspective: 1000px;
            transition: transform 0.1s ease-out;
            pointer-events: auto;
        }

        .subtitle {
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 5px;
            margin-bottom: 1rem;
            color: #ff9a9e;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 154, 158, 0.5);
            transform: translateZ(30px);
        }

        .title {
            font-size: 5rem;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(255, 154, 158, 0.4));
            margin-bottom: 1.5rem;
            transform: translateZ(60px);
        }

        .description {
            font-size: 1.2rem;
            color: rgba(0, 0, 0, 0.6);
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
            transform: translateZ(30px);
        }

        /* 載入提示 */
        #loading-msg {
            position: absolute;
            bottom: 30px;
            color: #ff9a9e;
            font-weight: bold;
            letter-spacing: 2px;
            animation: pulse 1.5s infinite;
            z-index: 5;
        }

        /* 偵測狀態指示燈 (按鈕樣式) */
        #status-indicator {
            position: absolute;
            top: 30px;
            right: 30px;
            padding: 12px 24px;
            background: rgba(255, 80, 80, 0.1);
            color: #ff5050;
            border: 1px solid rgba(255, 80, 80, 0.3);
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.95rem;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        #status-indicator::before {
            content: '';
            width: 12px;
            height: 12px;
            background: #ff5050;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s ease;
        }

        #status-indicator.active {
            background: rgba(0, 200, 100, 0.15);
            color: #008844;
            border-color: rgba(0, 200, 100, 0.3);
        }

        #status-indicator.active::before {
            background: #00cc00;
            box-shadow: 0 0 12px #00ff00;
        }

        @media (max-width: 768px) {
            .title { font-size: 3rem; }
            .subtitle { font-size: 1.2rem; }
            .welcome-container { padding: 2rem; margin: 1rem; }
        }
    </style>
</head>
<body>



    <!-- 偵測狀態按鈕 -->
    <div id="status-indicator">未偵測到手部</div>

    <!-- Gummy Bear Background -->
    <div class="slime-container">
        <!-- 手部感應圓圈 (現在變回可見，方便觸碰) -->
        <div class="blob" id="hand-blob"></div>
    </div>

    <a href="../index.html" class="back-link">← 回到主頁</a>

    <div class="welcome-container" id="tilt-card">
        <h2 class="subtitle">歡迎加入</h2>
        <h1 class="title">二林工商<br>資料處理科</h1>
        <p class="description">
            揮動你的手掌，看看背景的史萊姆特效！<br>體驗資訊科技與互動藝術的完美結合 ✨
        </p>
    </div>

    <div id="loading-msg">正在啟動攝影機與手部追蹤模型... ✋</div>

    <!-- MediaPipe Video Input -->
    <video class="input_video"></video>

    <script>
        // 1. 3D Tilt Effect for the card (mouse fallback & aesthetic)
        const card = document.getElementById('tilt-card');
        
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `perspective(1000px) rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = `perspective(1000px) rotateY(0deg) rotateX(0deg)`;
            card.style.transition = 'transform 0.5s ease';
        });

        document.addEventListener('mouseenter', () => {
            card.style.transition = 'none';
        });

        // 2. MediaPipe Hand Tracking Setup
        const videoElement = document.querySelector('.input_video');
        const handBlob = document.getElementById('hand-blob');
        const loadingMsg = document.getElementById('loading-msg');

        // --- 物理引擎 (小熊軟糖) ---
        const slimeContainer = document.querySelector('.slime-container');
        const handBlobEl = document.getElementById('hand-blob');
        const blobs = [];
        
        // 泡泡顏色庫 (原本那種夢幻感)
        const bubbleColors = [
            'rgba(255, 182, 193, 0.7)', // 粉紅
            'rgba(173, 216, 230, 0.7)', // 淺藍
            'rgba(221, 160, 221, 0.7)', // 薰衣草紫
            'rgba(144, 238, 144, 0.7)', // 淺綠
            'rgba(255, 218, 185, 0.7)'  // 粉橘
        ];

        // 生成 40 個物理引擎泡泡 (減少數量提升效能)
        for (let i = 0; i < 40; i++) {
            const size = Math.random() * 60 + 30; // 30px ~ 90px
            const el = document.createElement('div');
            el.className = 'blob';
            el.style.width = `${size}px`;
            el.style.height = `${size}px`;
            
            // 隨機上色
            el.style.background = bubbleColors[Math.floor(Math.random() * bubbleColors.length)];
            
            // 【點擊戳破功能】：滑鼠點擊泡泡時移除
            el.style.pointerEvents = 'auto'; 
            el.style.cursor = 'pointer';
            
            el.addEventListener('mousedown', (e) => {
                e.stopPropagation();
                playChomp(); // 暫用咬碎音效作為破裂聲
                if (navigator.vibrate) navigator.vibrate(50);
                
                // 產生一個簡單的破裂動畫效果
                el.style.transform = `${el.style.transform} scale(1.5)`;
                el.style.opacity = '0';
                
                setTimeout(() => {
                    const index = blobs.findIndex(b => b.el === el);
                    if (index > -1) blobs.splice(index, 1);
                    el.remove();
                }, 100);
            });
            
            slimeContainer.insertBefore(el, handBlobEl);

            blobs.push({
                el: el,
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                vx: (Math.random() - 0.5) * 5,
                vy: (Math.random() - 0.5) * 5,
                size: size
            });
        }


        // 音效引擎 (產生波波的水滴聲與吃掉的聲音)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBloop() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine';
            const now = audioCtx.currentTime;
            osc.frequency.setValueAtTime(600 + Math.random() * 400, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
        }

        function playChomp() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            const now = audioCtx.currentTime;
            // 高頻開始，快速下降模擬可愛氣泡破裂
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.08);
        }

        // 使用 lerp 讓手部追蹤極致滑順
        let targetHandX = -1000;
        let targetHandY = -1000;
        let currentHandX = -1000;
        let currentHandY = -1000;
        let handRadius = 60;
        let isHandOpen = false; 
        let isHandClosed = false; // 新增：追蹤手是否握拳

        function updatePhysics() {
            // 平滑插值 (Lerp) 游標位置，消除攝影機的抖動感
            // 極致精準追蹤 (將 0.35 提高到 0.7 讓跟隨幾乎同步，消除延遲感)
            currentHandX += (targetHandX - currentHandX) * 0.7;
            currentHandY += (targetHandY - currentHandY) * 0.7;

            // 更新實際渲染的手部位置
            handBlobEl.style.transform = `translate3d(${currentHandX}px, ${currentHandY}px, 0) translate(-50%, -50%)`;

            // 計算手部移動速度 (用於「撥動」效果)
            let handVX = currentHandX - (window.prevHandX || currentHandX);
            let handVY = currentHandY - (window.prevHandY || currentHandY);
            window.prevHandX = currentHandX;
            window.prevHandY = currentHandY;

            for (let i = blobs.length - 1; i >= 0; i--) {
                let b = blobs[i];
                
                // 加入微弱重力 (讓泡泡有緩緩掉落感，但比較輕盈)
                b.vy += 0.1; 
                
                b.x += b.vx;
                b.y += b.vy;

                // 碰到邊界反彈 (加入彈力衰減)
                if (b.x < 0) { b.x = 0; b.vx *= -0.8; }
                if (b.x > window.innerWidth) { b.x = window.innerWidth; b.vx *= -0.8; }
                if (b.y < 0) { b.y = 0; b.vy *= -0.8; }
                if (b.y > window.innerHeight) { 
                    b.y = window.innerHeight; 
                    b.vy *= -0.7; // 觸地反彈稍微減速
                    b.vx *= 0.9;  // 在地上的摩擦力
                }

                // 計算與平滑後手部的距離 (向量)
                let dx = b.x - currentHandX; 
                let dy = b.y - currentHandY;
                let dist = Math.sqrt(dx * dx + dy * dy);
                let minDist = (b.size / 2) + handRadius;

                // 1. 實體碰撞與「撥動」邏輯
                if (dist < minDist) {
                    let angle = Math.atan2(dy, dx);
                    // 將泡泡推到邊界外
                    b.x = currentHandX + Math.cos(angle) * minDist;
                    b.y = currentHandY + Math.sin(angle) * minDist;
                    
                    // 基礎反彈力
                    b.vx += Math.cos(angle) * 0.5;
                    b.vy += Math.sin(angle) * 0.5;

                    // 【撥動效果】：將手的移動速度傳遞給泡泡
                    b.vx += handVX * 0.5;
                    b.vy += handVY * 0.5;
                    
                    // 碰撞時的阻尼
                    b.vx *= 0.9;
                    b.vy *= 0.9;
                }

                // 2. Emoji 抓取與散開效果 (磁力/斥力)
                // 為了讓「碰」的感覺更明顯，我們調整磁力邏輯
                let dxPull = currentHandX - b.x;
                let dyPull = currentHandY - b.y;
                
                if (isHandClosed && dist > minDist && dist < 1500) { 
                    // 【握拳時】：產生強大引力 (抓取)
                    let pullForce = 120 / (dist + 50); 
                    b.vx += dxPull * pullForce * 0.02;
                    b.vy += dyPull * pullForce * 0.02;
                } else if (isHandOpen && dist < 800) {
                    // 當手完全「張開」時，恢復爆炸式散射效果
                    let scatterForce = (800 - dist) * 0.25; 
                    
                    b.vx -= dxPull * scatterForce * 0.02;
                    b.vy -= dyPull * scatterForce * 0.02;
                    
                    // 核心區域的噴發效果
                    if (dist < 350) {
                        b.vy -= Math.random() * 10; 
                        b.vx += (Math.random() - 0.5) * 12;
                    }
                }

                // 3. 泡泡彼此之間的碰撞偵測 (不讓它們黏在一起)
                for (let j = i + 1; j < blobs.length; j++) {
                    let b2 = blobs[j];
                    let dx2 = b2.x - b.x;
                    let dy2 = b2.y - b.y;
                    let dist2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);
                    let minDist2 = (b.size + b2.size) / 2;

                    if (dist2 < minDist2 && dist2 > 0) {
                        let angle = Math.atan2(dy2, dx2);
                        let overlap = minDist2 - dist2;
                        
                        // 修正重疊，讓它們分開
                        let moveX = Math.cos(angle) * (overlap / 2);
                        let moveY = Math.sin(angle) * (overlap / 2);
                        b.x -= moveX;
                        b.y -= moveY;
                        b2.x += moveX;
                        b2.y += moveY;

                        // 速度交換 (撞開效果)
                        let bounce = 0.5;
                        let tempVX = b.vx;
                        let tempVY = b.vy;
                        b.vx = (b.vx + b2.vx) * 0.1 - Math.cos(angle) * bounce;
                        b.vy = (b.vy + b2.vy) * 0.1 - Math.sin(angle) * bounce;
                        b2.vx = (tempVX + b2.vx) * 0.1 + Math.cos(angle) * bounce;
                        b2.vy = (tempVY + b2.vy) * 0.1 + Math.sin(angle) * bounce;
                    }
                }

                // 速度限制與摩擦力 (調高速度上限)
                let speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
                if (speed > 30) { 
                    b.vx *= 0.90;
                    b.vy *= 0.90;
                } else {
                    // 空氣阻力
                    b.vx *= 0.985;
                    b.vy *= 0.985;
                }

                let scaleX = 1 + Math.abs(b.vx) * 0.015;
                let scaleY = 1 + Math.abs(b.vy) * 0.015;
                b.el.style.transform = `translate3d(${b.x}px, ${b.y}px, 0) translate(-50%, -50%) scale(${Math.max(0.6, 1/scaleY)}, ${Math.max(0.6, 1/scaleX)})`;
            }
            requestAnimationFrame(updatePhysics);
        }
        updatePhysics();

        const statusIndicator = document.getElementById('status-indicator');

        // 當偵測到手部時的處理函式
        function onResults(results) {
            if(loadingMsg.style.display !== 'none') {
                loadingMsg.style.display = 'none';
            }

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusIndicator.innerText = '手部偵測中...';
                statusIndicator.classList.add('active');
                
                const landmarks = results.multiHandLandmarks[0];
                const indexFingerTip = landmarks[8]; // 使用食指指尖作為追蹤點
                
                // 寫入目標座標 (以食指指尖為中心)
                targetHandX = (1 - indexFingerTip.x) * window.innerWidth;
                targetHandY = indexFingerTip.y * window.innerHeight;

                // 如果是第一次偵測到，直接讓 current 跳過去避免飄移
                if (currentHandX === -1000) {
                    currentHandX = targetHandX;
                    currentHandY = targetHandY;
                }

                handBlobEl.style.opacity = 1;


                const wrist = landmarks[0];
                const middleFingerTip = landmarks[12];
                const thumbTip = landmarks[4];
                const pinkyTip = landmarks[20];

                const handSizeRaw = Math.sqrt(
                    Math.pow(wrist.x - middleFingerTip.x, 2) + 
                    Math.pow(wrist.y - middleFingerTip.y, 2)
                );
                
                const handSize = handSizeRaw * window.innerHeight * 1.5; 

                // 判斷手是否張大 (大拇指到小拇指的距離是否夠寬)
                const spreadDist = Math.sqrt(
                    Math.pow(thumbTip.x - pinkyTip.x, 2) + 
                    Math.pow(thumbTip.y - pinkyTip.y, 2)
                );
                
                // 計算手部狀態比例
                const spreadRatio = spreadDist / handSizeRaw;
                
                // 定義三種狀態：
                isHandOpen = spreadRatio > 1.3;   // 大力張開才散開
                isHandClosed = spreadRatio < 0.45; // 握拳才吸過來
                
                // 為了精準操控，我們將食指尖的物理半徑縮小並固定
                handRadius = 35; 
                
                handBlobEl.style.width = `${handRadius * 2}px`;
                handBlobEl.style.height = `${handRadius * 2}px`;

                // 手部標籤已移除，純粹維持物理運算的座標

            } else {
                statusIndicator.innerText = '未偵測到手部';
                statusIndicator.classList.remove('active');
                handBlobEl.style.opacity = 0;
                handX = -1000;
                handY = -1000;
                isHandOpen = false;
            }
        }

        // 初始化 Hands 模型
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1, // 只追蹤一隻手
            modelComplexity: 0, // 改為 0 可大幅提升效能與順暢度
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        // 啟動攝影機
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 640,
            height: 480
        });

        camera.start().catch(err => {
            console.error("Camera start failed:", err);
            loadingMsg.innerText = "無法存取攝影機 😢 請確認是否給予權限。";
            loadingMsg.style.color = "#ff6b6b";
        });

    </script>
</body>
</html>
